# 扣单宝 Windows 构建流水线（macOS 打包暂缓，配置保留注释）
# ==================================================================
# 当前阶段：仅打 Windows 包（nsis + portable，x64）。
# macOS 打包（macos-13 x64 / macos-14 arm64 → dmg + zip）：
#   配置与脚本均已就绪，未来启用时取消下方 matrix include 注释即可。
#   注意：mac 包必须在 macOS runner 打，且商业化前需 Apple 公证 + 签名。
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            electron_args: --win
          # ── macOS（暂缓）──────────────────────────────────────────
          # - os: macos-13
          #   electron_args: --mac --x64
          # - os: macos-14
          #   electron_args: --mac --arm64
          # ──────────────────────────────────────────────────────────
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend-src install
          npm --prefix electron install

      - name: Lint, format & typecheck
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend (Rust + assets)
        run: npm run build:backend

      - name: Test (typecheck + 69 协议 + 432 golden + 引擎/调度/打印/前端 Vitest)
        # PYTHONIOENCODING: CI runner 为 en-US（cp1252），Python 打印中文需强制 UTF-8
        env:
          PYTHONIOENCODING: utf-8
        run: npm test

      - name: Package (electron-builder)
        working-directory: electron
        run: npx electron-builder ${{ matrix.electron_args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koudanbao-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
